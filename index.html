<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anneler Günün Kutlu Olsun 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pink:#ff3d9a;--pink2:#ff79c6;--pink3:#ffb3e0;
  --purple:#c44dff;--purple2:#9b30ff;--gold:#ffcc80;
  --glass-bg:rgba(255,255,255,0.04);
  --glass-border:rgba(255,100,200,0.18);
}
html,body{width:100%;min-height:100dvh;height:100dvh;overflow:hidden;}
body{
  background:#04000d;
  font-family:'Poppins',sans-serif;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

/* ── BACKGROUND ── */
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-gradient{background:
  radial-gradient(ellipse 80% 60% at 50% 0%,#3a006a 0%,transparent 65%),
  radial-gradient(ellipse 60% 40% at 20% 80%,#1a0040 0%,transparent 60%),
  radial-gradient(ellipse 50% 50% at 80% 70%,#200035 0%,transparent 55%),
  radial-gradient(ellipse 100% 100% at 50% 50%,#0d0018 0%,#04000d 100%);}
.bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0;animation:orbFloat 8s ease-in-out infinite;}
.orb1{width:400px;height:400px;background:radial-gradient(circle,rgba(180,50,255,.25),transparent 70%);top:-100px;left:-100px;}
.orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(255,60,150,.2),transparent 70%);bottom:-80px;right:-80px;animation-delay:-3s;}
.orb3{width:250px;height:250px;background:radial-gradient(circle,rgba(100,0,200,.18),transparent 70%);top:40%;left:60%;animation-delay:-5s;}
@keyframes orbFloat{0%,100%{opacity:.6;transform:translate(0,0) scale(1);}33%{opacity:.9;transform:translate(30px,-20px) scale(1.1);}66%{opacity:.5;transform:translate(-20px,30px) scale(.95);}}

/* ── STARS ── */
#stars{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.star{position:absolute;border-radius:50%;background:white;animation:starTwinkle var(--d,3s) ease-in-out infinite var(--delay,0s);}
@keyframes starTwinkle{0%,100%{opacity:var(--min-op,.1);transform:scale(1);}50%{opacity:var(--max-op,.8);transform:scale(1.4);}}

/* ── DUST ── */
.dust{position:fixed;border-radius:50%;pointer-events:none;z-index:0;opacity:0;animation:dustRise var(--dur,12s) linear infinite var(--del,0s);filter:drop-shadow(0 0 12px currentColor);}
@keyframes dustRise{0%{transform:translateY(0) translateX(0) scale(0);opacity:0;}10%{opacity:var(--op,.5);}90%{opacity:var(--op,.4);}100%{transform:translateY(-100vh) translateX(var(--dx,20px)) scale(1.5);opacity:0;}}

/* ── GLASS CARD ── */
#card{
  position:relative;z-index:10;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:clamp(14px,3vw,24px);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);border-radius:32px;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 0 0 1px rgba(255,100,200,.08),0 8px 32px rgba(0,0,0,.6),0 0 80px rgba(180,50,255,.12),inset 0 1px 0 rgba(255,255,255,.06);
  width: min(430px,94vw);
  height: auto;
  min-height: auto;
  max-height: 94dvh;
  overflow:hidden;
  gap: clamp(6px,1.5vh,12px);
  animation:cardAppear 1.2s cubic-bezier(.23,1,.32,1) forwards;
}
@keyframes cardAppear{from{opacity:0;transform:translateY(30px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
#card::before{content:'';position:absolute;inset:-1px;border-radius:33px;background:linear-gradient(135deg,rgba(255,80,160,.4) 0%,transparent 40%,transparent 60%,rgba(180,50,255,.3) 100%);z-index:-1;animation:shimmerBorder 4s linear infinite;}
@keyframes shimmerBorder{0%,100%{opacity:.6;}50%{opacity:1;}}

/* ── TITLE ── */
#baslik-wrap{text-align:center;margin-bottom:10px;position:relative;}
#baslik-line1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700;background:linear-gradient(135deg,#ffb3e0 0%,#ff4fa3 40%,#c44dff 80%,#ffb3e0 100%);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientShift 4s ease infinite,titleFloat 3s ease-in-out infinite;display:block;line-height:1.2;filter:drop-shadow(0 0 20px rgba(255,79,163,.5));letter-spacing:.02em;}

/* Final card mode (centers final composition without changing layout flow) */
#card.final-mode{justify-content:center}
#card.final-mode #baslik-wrap{margin-bottom:6px}
#card.final-mode #baslik-line1{font-size:clamp(1.8rem,7vw,2.8rem)}
#card.final-mode #baslik-line2{font-size:clamp(1rem,4.2vw,1.4rem)}
#card.final-mode #sonMesaj{margin-top:6px}
#baslik-line2{font-family:'Poppins',sans-serif;font-size:clamp(.85rem,2.4vw,1rem);font-weight:500;color:rgba(255,180,220,.8);letter-spacing:.15em;display:block;margin-top:.3rem;}
#baslik-wrap::after{content:'✦  ✦  ✦';display:block;font-size:.55rem;letter-spacing:.8em;color:rgba(255,100,180,.35);margin-top:.6rem;}
@keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
@keyframes titleFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

/* ── HEART STAGE ── */
#sahne{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;transition:opacity .8s ease, height .8s ease;}
#sahne.hidden{opacity:0;pointer-events:none;height:0;overflow:hidden;}
.glow-ring{position:absolute;border-radius:50%;border:1px solid rgba(255,70,160,.15);animation:ringPulse 2.5s ease-in-out infinite;}
.ring1{width:120px;height:120px;}
.ring2{width:155px;height:155px;animation-delay:.4s;border-color:rgba(180,50,255,.1);}
.ring3{width:185px;height:185px;animation-delay:.8s;border-color:rgba(255,70,160,.06);}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.6;}50%{transform:scale(1.06);opacity:1;}}

#kalp-wrap{position:relative;width:110px;height:110px;display:flex;align-items:center;justify-content:center;}
#kalp-svg{width:110px;height:110px;filter:drop-shadow(0 0 8px #ff4fa3) drop-shadow(0 0 20px rgba(255,79,163,.7)) drop-shadow(0 0 50px rgba(255,79,163,.4)) drop-shadow(0 0 90px rgba(180,50,255,.3));animation:heartBeat 1.4s cubic-bezier(.215,.61,.355,1) infinite;transform-origin:center bottom;}
#heart-shine{position:absolute;top:18%;left:28%;width:30%;height:22%;background:radial-gradient(ellipse,rgba(255,255,255,.5) 0%,transparent 70%);border-radius:50%;pointer-events:none;transform:rotate(-30deg);filter:blur(3px);}
@keyframes heartBeat{0%,100%{transform:scale(1);}14%{transform:scale(1.13);}28%{transform:scale(1);}42%{transform:scale(1.08);}70%{transform:scale(1);}}

@keyframes heartGrow{0%{transform:scale(1);}30%{transform:scale(1.4);}65%{transform:scale(2.1);filter:brightness(1.5);}100%{transform:scale(2.5);filter:brightness(2.2);}}
#kalp-wrap.buyuyor{animation:heartGrow 1.9s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes heartBurst{0%{transform:scale(2.5);opacity:1;filter:brightness(3);}50%{transform:scale(3.8);opacity:.4;}100%{transform:scale(.1);opacity:0;filter:brightness(5);}}
#kalp-wrap.patladi{animation:heartBurst .45s ease-in forwards;}

/* ── BUTTON ── */
#dokunBtn{
  position:relative;margin-top:1.2rem;padding:.9rem 2.6rem;border:none;border-radius:50px;
  background:linear-gradient(135deg,#c4006e 0%,#7b00c4 100%);
  color:#fff;font-family:'Poppins',sans-serif;font-size:.95rem;font-weight:500;letter-spacing:.12em;cursor:pointer;overflow:hidden;z-index:1;
  box-shadow:0 0 0 1px rgba(255,80,160,.3),0 0 20px rgba(255,60,150,.4),0 0 50px rgba(180,50,255,.2),0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .2s,box-shadow .3s,opacity .5s;
  animation:btnGlow 2.5s ease-in-out infinite;
}
#dokunBtn::before{content:'';position:absolute;top:-50%;left:-80%;width:60%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:btnShimmer 2.5s ease-in-out infinite;}
#dokunBtn::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(to bottom,rgba(255,255,255,.12),transparent);border-radius:50px 50px 0 0;pointer-events:none;}
#dokunBtn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 0 1px rgba(255,80,160,.5),0 0 30px rgba(255,60,150,.7),0 0 70px rgba(180,50,255,.4),0 8px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);}
#dokunBtn:active{transform:translateY(0) scale(.98);}
#dokunBtn.gizli{opacity:0;pointer-events:none;transform:translateY(10px) scale(.95);}
@keyframes btnGlow{0%,100%{box-shadow:0 0 0 1px rgba(255,80,160,.3),0 0 20px rgba(255,60,150,.4),0 0 50px rgba(180,50,255,.2),0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);}50%{box-shadow:0 0 0 1px rgba(255,80,160,.5),0 0 35px rgba(255,60,150,.6),0 0 80px rgba(180,50,255,.35),0 4px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);}}
@keyframes btnShimmer{0%{left:-80%;}60%,100%{left:120%;}}

/* ── PARTICLES ── */
#parcaciklar{position:fixed;inset:0;pointer-events:none;z-index:50;}
.parcacik{position:absolute;border-radius:50%;pointer-events:none;animation:parcFly var(--dur,1.2s) cubic-bezier(.25,.46,.45,.94) forwards;}
@keyframes parcFly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1;}70%{opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(0) rotate(var(--rot,360deg));opacity:0;}}
.parcacik.spark{border-radius:2px;}

/* ── FLASH ── */
#flash{position:fixed;inset:0;z-index:100;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,150,220,.65) 0%,transparent 70%);}
#flash.aktif{animation:flashBurst .65s ease-out forwards;}
@keyframes flashBurst{0%{opacity:0;}15%{opacity:1;}100%{opacity:0;}}

/* ══════════════════════════════════════════
   GLASS DOME + MAGICAL ROSE — FINAL SCENE
══════════════════════════════════════════ */
#cicek-wrap{display:none;flex-direction:column;align-items:center;justify-content:center;margin-top:0;transform:none;}
#cicek-wrap.goster{display:flex;animation:fadeRise .8s ease forwards;}
@keyframes fadeRise { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* Dome SVG sizing */
#dome-svg{
  width:clamp(210px,62vw,320px);height:clamp(250px,42dvh,360px);max-height:42dvh;overflow:visible;object-fit:contain;
  filter:drop-shadow(0 0 18px rgba(255,79,163,.5)) drop-shadow(0 0 50px rgba(180,50,255,.3));
  animation:domeFloat 4s ease-in-out infinite;
}
@keyframes domeFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

/* Dome ambient sparkles (generated by JS) */
.dome-sparkle{
  position:absolute;border-radius:50%;pointer-events:none;
  animation:sparkleAnim var(--sd,2s) ease-in-out infinite var(--sdel,0s);
}
@keyframes sparkleAnim{0%,100%{opacity:0;transform:scale(0);}50%{opacity:1;transform:scale(1);}}

/* Rose petals — bloom animation */
.rp{
  transform-origin: 110px 148px; /* rose center */
  opacity:0;
  animation: petalOpen .9s cubic-bezier(.34,1.4,.64,1) var(--pd,0s) forwards;
}
@keyframes petalOpen{
  0%  {opacity:0;transform:scale(0) rotate(var(--pa,0deg));}
  60% {opacity:.95;}
  100%{opacity:1;transform:scale(1) rotate(var(--pa,0deg));}
}

/* Inner bud petals — slightly different timing */
.rp-inner{
  transform-origin: 110px 148px;
  opacity:0;
  animation: petalOpen .7s cubic-bezier(.34,1.5,.64,1) var(--pd,0s) forwards;
}

/* stem + leaves */
.stem{stroke-dasharray:160;stroke-dashoffset:160;animation:stemDraw .9s ease .1s forwards;}
@keyframes stemDraw{to{stroke-dashoffset:0;}}
.leaf{opacity:0;animation:leafOpen .6s cubic-bezier(.34,1.4,.64,1) var(--ld,.8s) forwards;}
@keyframes leafOpen{from{opacity:0;transform:scale(0);}to{opacity:1;transform:scale(1);}}

/* Crystal base glow */
.crystal{animation:crystalPulse 2.5s ease-in-out infinite;}
@keyframes crystalPulse{0%,100%{filter:drop-shadow(0 0 6px #b44cff);}50%{filter:drop-shadow(0 0 18px #ff4fa3) drop-shadow(0 0 30px #b44cff);}}

/* Rose center glow */
.rose-core{animation:corePulse 1.8s ease-in-out infinite alternate;}
@keyframes corePulse{from{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #ffcc80);}to{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 30px #ff8c00);}}

/* Dome aura ring */
.dome-aura{animation:auraPulse 3s ease-in-out infinite;}
@keyframes auraPulse{0%,100%{opacity:.25;}50%{opacity:.6;}}

/* ── MESSAGE ── */
#sonMesaj{display:block;margin-top:4px;font-family:'Poppins',sans-serif;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.1;font-weight:800;text-align:center;color:#ff9ad5;text-shadow:0 0 12px #ff4fa3,0 0 30px rgba(255,79,163,.8);opacity:0;transform:translateY(12px);z-index:20;}
#sonMesaj.goster{opacity:1;transform:translateY(0);transition:all .9s ease;}

/* ── REPLAY ── */
#tekrarBtn{display:none;}

@media(max-width:480px){
  #card{
    width:94vw;
    max-height:94dvh;
    padding:16px 14px;
    gap:6px;
  }

  #baslik-line1{
    font-size:clamp(2rem,11vw,3rem);
    line-height:1.05;
  }

  #baslik-wrap{margin-bottom:4px}

  #dome-svg{
    width:clamp(220px,78vw,310px);
    height:clamp(250px,40dvh,340px);
    max-height:40dvh;
  }

  #sonMesaj{
    font-size:clamp(1.5rem,8vw,2.4rem);
    line-height:1.08;
    margin-top:0;
  }
}
</style>
</head>
<body>

<div class="bg-layer bg-gradient"></div>
<div class="bg-layer">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>
</div>
<div id="stars"></div>
<div id="flash"></div>
<div id="parcaciklar"></div>

<div id="card">

  <div id="baslik-wrap">
    <span id="baslik-line1">Anneler Günün Kutlu Olsun</span>
  </div>

  <!-- HEART STAGE -->
  <div id="sahne">
    <div class="glow-ring ring1"></div>
    <div class="glow-ring ring2"></div>
    <div class="glow-ring ring3"></div>
    <div id="kalp-wrap">
      <svg id="kalp-svg" viewBox="0 0 100 95" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="hg1" cx="35%" cy="30%" r="65%">
            <stop offset="0%" stop-color="#ff9ad5"/><stop offset="40%" stop-color="#ff4fa3"/>
            <stop offset="75%" stop-color="#cc007a"/><stop offset="100%" stop-color="#7a0047"/>
          </radialGradient>
          <radialGradient id="hg2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff79c6" stop-opacity=".4"/>
            <stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="hg3" cx="30%" cy="20%" r="50%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <radialGradient id="hg4" cx="50%" cy="90%" r="50%">
            <stop offset="0%" stop-color="rgba(80,0,40,0.5)"/><stop offset="100%" stop-color="rgba(80,0,40,0)"/>
          </radialGradient>
        </defs>
        <path d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C37 5 45 10 50 18 C55 10 63 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85Z" fill="url(#hg2)" transform="scale(1.12) translate(-4,-4)" opacity=".6"/>
        <path d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C37 5 45 10 50 18 C55 10 63 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85Z" fill="url(#hg1)"/>
        <path d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C37 5 45 10 50 18 C55 10 63 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85Z" fill="url(#hg4)"/>
        <ellipse cx="33" cy="27" rx="14" ry="11" fill="url(#hg3)" transform="rotate(-20 33 27)"/>
        <ellipse cx="64" cy="22" rx="8" ry="6" fill="rgba(255,255,255,0.25)" transform="rotate(-10 64 22)"/>
      </svg>
      <div id="heart-shine"></div>
    </div>
  </div>

  <button id="dokunBtn" onclick="baslaAnimasyon()">Kalbime Dokun ♥</button>

  <!-- ══ GLASS DOME + MAGICAL ROSE (final scene) ══ -->
  <div id="cicek-wrap">
    <div style="position:relative;display:inline-block;" id="dome-container">

      <svg id="dome-svg" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
        <defs>

          <!-- ── DOME GLASS ── -->
          <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="rgba(200,140,255,0.18)"/>
            <stop offset="30%"  stop-color="rgba(255,200,240,0.07)"/>
            <stop offset="70%"  stop-color="rgba(180,100,255,0.05)"/>
            <stop offset="100%" stop-color="rgba(220,160,255,0.22)"/>
          </linearGradient>
          <linearGradient id="domeGloss" x1="0%" y1="0%" x2="30%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.35)"/>
            <stop offset="40%"  stop-color="rgba(255,255,255,0.05)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <radialGradient id="domeFloor" cx="50%" cy="100%" r="50%">
            <stop offset="0%"   stop-color="rgba(180,80,255,0.25)"/>
            <stop offset="100%" stop-color="rgba(180,80,255,0)"/>
          </radialGradient>

          <!-- ── BASE PLATFORM ── -->
          <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#3a1060"/>
            <stop offset="50%"  stop-color="#1e0840"/>
            <stop offset="100%" stop-color="#0d0020"/>
          </linearGradient>
          <linearGradient id="baseShine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="rgba(200,120,255,0.4)"/>
            <stop offset="100%" stop-color="rgba(200,120,255,0)"/>
          </linearGradient>

          <!-- ── ROSE PETALS ── -->
          <!-- Outer petals — deep pink-magenta -->
          <radialGradient id="rp_outer" cx="50%" cy="75%" r="65%" fx="50%" fy="80%">
            <stop offset="0%"   stop-color="#ff1a7a"/>
            <stop offset="35%"  stop-color="#e0006a"/>
            <stop offset="70%"  stop-color="#9b0050"/>
            <stop offset="100%" stop-color="#5e0030"/>
          </radialGradient>
          <!-- Mid petals -->
          <radialGradient id="rp_mid" cx="50%" cy="70%" r="65%">
            <stop offset="0%"   stop-color="#ff4fa3"/>
            <stop offset="40%"  stop-color="#e8006e"/>
            <stop offset="85%"  stop-color="#8b0045"/>
            <stop offset="100%" stop-color="#4a0025"/>
          </radialGradient>
          <!-- Inner petals — brighter -->
          <radialGradient id="rp_inner" cx="50%" cy="60%" r="60%">
            <stop offset="0%"   stop-color="#ff85c8"/>
            <stop offset="30%"  stop-color="#ff3d9a"/>
            <stop offset="70%"  stop-color="#c4005e"/>
            <stop offset="100%" stop-color="#6b0035"/>
          </radialGradient>
          <!-- Petal highlight -->
          <linearGradient id="rp_shine" x1="0%" y1="0%" x2="40%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,200,235,0.55)"/>
            <stop offset="60%"  stop-color="rgba(255,100,180,0.1)"/>
            <stop offset="100%" stop-color="rgba(255,100,180,0)"/>
          </linearGradient>

          <!-- ── ROSE CORE ── -->
          <radialGradient id="coreGrad" cx="40%" cy="35%" r="60%">
            <stop offset="0%"   stop-color="#fffbe0"/>
            <stop offset="25%"  stop-color="#ffd700"/>
            <stop offset="55%"  stop-color="#ff9800"/>
            <stop offset="100%" stop-color="#e75480"/>
          </radialGradient>
          <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="rgba(255,240,150,0.8)"/>
            <stop offset="100%" stop-color="rgba(255,180,50,0)"/>
          </radialGradient>

          <!-- ── STEM / LEAVES ── -->
          <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#2a6a2a"/>
            <stop offset="50%"  stop-color="#5ecf5e"/>
            <stop offset="100%" stop-color="#2a6a2a"/>
          </linearGradient>
          <radialGradient id="leafGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%"   stop-color="#7be07b"/>
            <stop offset="60%"  stop-color="#3aaa3a"/>
            <stop offset="100%" stop-color="#1a5a1a"/>
          </radialGradient>

          <!-- ── CRYSTAL ── -->
          <linearGradient id="crystal1" x1="0%" y1="0%" x2="100%" y2="100%">

        <!-- ══ DOME OUTER AURA ══ -->

        <!-- ══ MAGICAL ROSE — 24 LAYERED PETALS ══ -->

        <!-- OUTERMOST petals (8) — largest, darkest -->
        <g filter="url(#petalGlow)">
          <!-- p1 -->

          <!-- p5 -->
          <ellipse class="rp" style="--pa:180deg; --pd:1.1s" cx="110" cy="114" rx="11" ry="28" fill="url(#rp_outer)" transform-origin="110px 148px"/>
          <!-- p6 -->
          <ellipse class="rp" style="--pa:225deg; --pd:1.25s" cx="110" cy="114" rx="11" ry="28" fill="url(#rp_outer)" transform-origin="110px 148px"/>
          <!-- p7 -->

          <!-- p8 -->

        <!-- MID petals (8) — offset 22.5°, shorter -->
        <g filter="url(#petalGlow)">
          <ellipse class="rp" style="--pa:22deg;  --pd:1.0s"  cx="110" cy="120" rx="10" ry="23" fill="url(#rp_mid)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:67deg;  --pd:1.1s"  cx="110" cy="120" rx="10" ry="23" fill="url(#rp_mid)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:112deg; --pd:1.2s"  cx="110" cy="120" rx="10" ry="23" fill="url(#rp_mid)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:157deg; --pd:1.3s"  cx="110" cy="120" rx="10" ry="23" fill="url(#rp_mid)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:202deg; --pd:1.4s"  cx="110" cy="120" rx="10" ry="23" fill="url(#rp_mid)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:247deg; --pd:1.5s"  cx="110" cy="120" rx="10" ry="23" fill="url(#rp_mid)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:292deg; --pd:1.6s"  cx="110" cy="120" rx="10" ry="23" fill="url(#rp_mid)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:337deg; --pd:1.7s"  cx="110" cy="120" rx="10" ry="23" fill="url(#rp_mid)" transform-origin="110px 148px"/>
        </g>

        <!-- INNER petals (8) — tightest, brightest -->
        <g filter="url(#petalGlow)">
          <ellipse class="rp-inner" style="--pa:0deg;   --pd:1.55s" cx="110" cy="128" rx="8" ry="17" fill="url(#rp_inner)" transform-origin="110px 148px"/>
          <ellipse class="rp-inner" style="--pa:45deg;  --pd:1.65s" cx="110" cy="128" rx="8" ry="17" fill="url(#rp_inner)" transform-origin="110px 148px"/>
          <ellipse class="rp-inner" style="--pa:90deg;  --pd:1.75s" cx="110" cy="128" rx="8" ry="17" fill="url(#rp_inner)" transform-origin="110px 148px"/>
          <ellipse class="rp-inner" style="--pa:135deg; --pd:1.85s" cx="110" cy="128" rx="8" ry="17" fill="url(#rp_inner)" transform-origin="110px 148px"/>
          <ellipse class="rp-inner" style="--pa:180deg; --pd:1.95s" cx="110" cy="128" rx="8" ry="17" fill="url(#rp_inner)" transform-origin="110px 148px"/>
          <ellipse class="rp-inner" style="--pa:225deg; --pd:2.05s" cx="110" cy="128" rx="8" ry="17" fill="url(#rp_inner)" transform-origin="110px 148px"/>
          <ellipse class="rp-inner" style="--pa:270deg; --pd:2.15s" cx="110" cy="128" rx="8" ry="17" fill="url(#rp_inner)" transform-origin="110px 148px"/>
          <ellipse class="rp-inner" style="--pa:315deg; --pd:2.25s" cx="110" cy="128" rx="8" ry="17" fill="url(#rp_inner)" transform-origin="110px 148px"/>
        </g>

        <!-- Petal shine overlays -->
        <g opacity=".4">
          <ellipse class="rp" style="--pa:0deg;   --pd:.5s"  cx="110" cy="114" rx="4" ry="14" fill="url(#rp_shine)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:90deg;  --pd:.8s"  cx="110" cy="114" rx="4" ry="14" fill="url(#rp_shine)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:180deg; --pd:1.1s" cx="110" cy="114" rx="4" ry="14" fill="url(#rp_shine)" transform-origin="110px 148px"/>
          <ellipse class="rp" style="--pa:270deg; --pd:1.4s" cx="110" cy="114" rx="4" ry="14" fill="url(#rp_shine)" transform-origin="110px 148px"/>

        <!-- ── ROSE CORE GLOW ── -->
        <circle cx="110" cy="148" r="18" fill="url(#coreGlow)" opacity=".7"/>
        <circle class="rose-core" cx="110" cy="148" r="11" fill="url(#coreGrad)" opacity=".95"/>
        <circle cx="110" cy="148" r="6" fill="#fff9e0" opacity=".9"/>
        <circle cx="107" cy="145" r="2.5" fill="rgba(255,255,255,0.7)" opacity=".8"/>

        <!-- ══ DOME GLASS OVERLAY (on top of flower) ══ -->
        <!-- Glass edge highlight — left -->
        <path d="M15 140 Q15 18 110 18"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"
          stroke-linecap="round" filter="url(#glassBlur)"/>
        <!-- Glass edge highlight — right subtle -->
        <path d="M205 140 Q205 18 110 18"
          fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"
          stroke-linecap="round"/>

        <path d="M60 30 Q110 16 160 30"
          fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3"

        <ellipse cx="68" cy="65" rx="18" ry="32"
          fill="url(#domeGloss)" opacity=".7" filter="url(#glassBlur)"/>

        <path d="M110 18 Q205 18 205 140 Q205 248 110 248 Q15 248 15 140 Q15 18 110 18 Z"
          fill="none" stroke="rgba(200,120,255,0.25)" stroke-width="1.5"/>
        <!-- Top rim -->
        <ellipse cx="110" cy="18" rx="15" ry="5"

      </svg>

      <!-- Floating sparkles around dome (injected by JS) -->
      <div id="dome-sparkles" style="position:absolute;inset:0;pointer-events:none;"></div>

    <p id="sonMesaj">İyi ki varsın<br>Canım Annem 💗</p>
  </div>

  <button id="tekrarBtn" onclick="location.reload()">✦ Tekrar İzle</button>

</div><!-- /card -->

<script>
/* ── STARS ── */
(function(){
  const c=document.getElementById('stars');
  const STAR_COUNT = window.innerWidth < 480 ? 80 : 250;
  for(let i=0;i<STAR_COUNT;i++){
    const s=document.createElement('div'); s.className='star';
    // slightly larger stars on small screens for visibility
    const sz=(window.innerWidth<480?1.2:Math.random()<.15?1.5+Math.random()*1.5:.5+Math.random());
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--min-op:${(.05+Math.random()*.15).toFixed(2)};--max-op:${(.45+Math.random()*.55).toFixed(2)};--d:${(1.8+Math.random()*3).toFixed(1)}s;--delay:${(-Math.random()*5).toFixed(1)}s;box-shadow:0 0 ${Math.max(2,sz*2)}px rgba(255,200,240,0.75);`;
    c.appendChild(s);
  }
})();

/* ── DUST ── */
(function(){
  const cols=['rgba(255,79,163,VAL)','rgba(180,50,255,VAL)','rgba(255,180,220,VAL)'];
  const DUST_COUNT = window.innerWidth < 480 ? 30 : 100;
  for(let i=0;i<DUST_COUNT;i++){
    const el=document.createElement('div'); el.className='dust';
    // larger, brighter dust on mobile for visibility
    const base = window.innerWidth<480?1.2:1.5;
    const sz=base + Math.random()*5;
    const col=cols[Math.floor(Math.random()*cols.length)].replace('VAL',(.45+Math.random()*.5).toFixed(2));
    el.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${-sz}px;background:${col};color:${col};box-shadow:0 0 ${sz*6}px ${col};--dur:${8+Math.random()*10}s;--del:${-Math.random()*12}s;--dx:${Math.random()*60-30}px;--op:${.35+Math.random()*.55};`;
    document.body.appendChild(el);
  }
})();

/* ── DOM REFS ── */
const kalpWrap  = document.getElementById('kalp-wrap');
const kalpSvg   = document.getElementById('kalp-svg');
const dokunBtn  = document.getElementById('dokunBtn');
const tekrarBtn = document.getElementById('tekrarBtn');
const parcKap   = document.getElementById('parcaciklar');
const cicekWrap = document.getElementById('cicek-wrap');
const sonMesaj  = document.getElementById('sonMesaj');
const flash     = document.getElementById('flash');
const sahne     = document.getElementById('sahne');

const COLORS=['#ff4fa3','#ff79c6','#ffb3e0','#b44cff','#c44dff','#ffd6ec','#ffffff','#ff9ad5','#e040fb'];

/* ── STEP 1: GROW ── */
function baslaAnimasyon(){
  dokunBtn.classList.add('gizli');
  kalpSvg.style.animation='none';
  void kalpSvg.offsetWidth;
  kalpWrap.classList.add('buyuyor');
  setTimeout(kalbiPatlat, 2000);
}

/* ── STEP 2: EXPLODE ── */
function kalbiPatlat(){
  const rect=kalpWrap.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  flash.classList.add('aktif');
  setTimeout(()=>flash.classList.remove('aktif'),700);
  kalpWrap.classList.remove('buyuyor'); void kalpWrap.offsetWidth;
  kalpWrap.classList.add('patladi');
  // Adjust particle count for mobile devices to improve performance
  const TOTAL_PARTICLES = window.innerWidth < 420 ? 120 : window.innerWidth < 768 ? 160 : 200;
  const STEP = window.innerWidth < 420 ? 10 : 6;
  for(let i=0;i<TOTAL_PARTICLES;i++) setTimeout(()=>spawnParticle(cx,cy),i*STEP+Math.random()*120);
  setTimeout(cicekGoster, 900);
}

function spawnParticle(cx,cy){
  const el=document.createElement('div'); el.classList.add('parcacik');
  const col=COLORS[Math.floor(Math.random()*COLORS.length)];
  const isSmall = window.innerWidth < 420;
  if(Math.random() < (isSmall ? 0.6 : 0.5)){
    const sz = (isSmall ? 2 + Math.random()*6 : 3 + Math.random()*10);
    el.style.width = sz+'px'; el.style.height = sz+'px';
    el.style.background = `radial-gradient(circle at 30% 30%,white,${col})`;
    const glow1 = Math.max(2, Math.round(sz*1.2));
    const glow2 = Math.max(4, Math.round(sz*2));
    el.style.boxShadow = `0 0 ${glow1}px ${col},0 0 ${glow2}px ${col}55`;
  } else {
    el.classList.add('spark');
    const w = (isSmall ? 1.6 + Math.random()*2 : 2 + Math.random()*2.5);
    const h = (isSmall ? 4 + Math.random()*8 : 5 + Math.random()*12);
    el.style.width = w+'px'; el.style.height = h+'px';
    el.style.background = col; el.style.borderRadius = '2px';
    const glowA = Math.max(3, Math.round(h));
    const glowB = Math.max(6, Math.round(h*1.6));
    el.style.boxShadow = `0 0 ${glowA}px ${col},0 0 ${glowB}px ${col}88`;
  }
  el.style.left=cx+'px'; el.style.top=cy+'px'; el.style.transform='translate(-50%,-50%)';
  const angle=Math.random()*2*Math.PI, speed=60+Math.random()*280, grav=50+Math.random()*130;
  el.style.setProperty('--tx',(Math.cos(angle)*speed)+'px');
  el.style.setProperty('--ty',(Math.sin(angle)*speed+grav)+'px');
  el.style.setProperty('--dur',(.7+Math.random()*1.2)+'s');
  el.style.setProperty('--rot',(Math.random()*720-360)+'deg');
  parcKap.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

/* ── STEP 3: SHOW FLOWER ── */
function cicekGoster(){
  sahne.classList.add('hidden');
  cicekWrap.classList.add('goster');

  // Put card into final-mode to optimize layout for final scene
  const card = document.getElementById('card');
  if(card) card.classList.add('final-mode');
  const dok = document.getElementById('dokunBtn'); if(dok) dok.style.display='none';

  // Build dome sparkles (slightly delayed)
  setTimeout(buildDomeSparkles, 800);

  // Reveal final message overlapping confetti
  setTimeout(()=>{ sonMesaj.classList.add('goster'); }, 800);
}

/* ── DOME SPARKLES ── */
function buildDomeSparkles(){
  const container=document.getElementById('dome-sparkles');
  const sparkColors=['#ff79c6','#ffb3e0','#c44dff','#ffffff','#ffd6ec','#b44cff'];
  const DOME_SPARKLES = window.innerWidth < 480 ? 10 : 35;
  for(let i=0;i<DOME_SPARKLES;i++){
    const el=document.createElement('div');
    el.className='dome-sparkle';
    const sz=2+Math.random()*4;
    const col=sparkColors[Math.floor(Math.random()*sparkColors.length)];
    // Distribute sparkles roughly around dome silhouette
    const angle=(Math.random()*2*Math.PI);
    const rx=85+Math.random()*20, ry=108+Math.random()*20;
    const cx=110, cy=133; // dome center in viewBox coords
    // Convert to percentage of SVG element (220x280)
    const svgX=cx + Math.cos(angle)*rx;
    const svgY=cy + Math.sin(angle)*ry;
    const pctX=(svgX/220*100).toFixed(1)+'%';
    const pctY=(svgY/280*100).toFixed(1)+'%';
    el.style.cssText=`
      width:${sz}px;height:${sz}px;
      left:${pctX};top:${pctY};
      background:${col};
      box-shadow:0 0 ${sz*2}px ${col},0 0 ${sz*4}px ${col}88;
      --sd:${1.5+Math.random()*2.5}s;
      --sdel:${(-Math.random()*2).toFixed(1)}s;
    `;
    container.appendChild(el);
  }
}
</script>
